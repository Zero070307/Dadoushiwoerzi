<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三角洲行动 · 改枪码大全 | S10 核子裂变</title>
<style>
  :root {
    --bg-primary: #0a0e12;
    --bg-secondary: #11161c;
    --bg-card: #161b22;
    --bg-card-hover: #1c2430;
    --border: #21262d;
    --border-active: #f0b90b;
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-muted: #6e7681;
    --accent: #f0b90b;
    --accent-dim: #9e7a0a;
    --danger: #ff6b6b;
    --success: #3fb950;
    --info: #58a6ff;
    --purple: #bc8cff;
    --radius: 8px;
    --radius-lg: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* --- Header --- */
  .header {
    background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
    border-bottom: 1px solid var(--border);
    padding: 32px 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(240,185,11,0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .header-icon { font-size: 48px; margin-bottom: 12px; display: block; }
  .header h1 {
    font-size: 2rem;
    font-weight: 800;
    background: linear-gradient(135deg, #f0b90b, #d4a30a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 1px;
  }
  .header .subtitle {
    color: var(--text-secondary);
    margin-top: 6px;
    font-size: 0.95rem;
  }
  .header .season-badge {
    display: inline-block;
    margin-top: 12px;
    padding: 4px 14px;
    border: 1px solid var(--accent);
    border-radius: 20px;
    color: var(--accent);
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  /* --- Stats Bar --- */
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 32px;
    padding: 16px 20px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .stat-item {
    text-align: center;
  }
  .stat-value {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--accent);
  }
  .stat-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* --- Container --- */
  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 20px;
  }

  /* --- Search & Filter --- */
  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-wrapper {
    flex: 1;
    min-width: 220px;
    position: relative;
  }
  .search-wrapper input {
    width: 100%;
    padding: 10px 40px 10px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-primary);
    font-size: 0.93rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-wrapper input:focus {
    border-color: var(--accent);
  }
  .search-wrapper input::placeholder { color: var(--text-muted); }
  .search-icon {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
    font-size: 1.1rem;
  }
  .filter-select {
    padding: 10px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-primary);
    font-size: 0.88rem;
    outline: none;
    cursor: pointer;
    min-width: 130px;
  }
  .filter-select:focus { border-color: var(--accent); }
  .filter-select option { background: var(--bg-card); color: var(--text-primary); }

  .btn {
    padding: 10px 18px;
    border-radius: var(--radius);
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn-primary {
    background: var(--accent);
    color: #000;
  }
  .btn-primary:hover { background: #f5c71a; }
  .btn-outline {
    background: transparent;
    border-color: var(--border);
    color: var(--text-primary);
  }
  .btn-outline:hover, .btn-outline.active {
    border-color: var(--accent);
    color: var(--accent);
  }
  .btn-outline .arrow { font-size: 0.7rem; margin-left: 2px; }

  /* --- Active Filters Bar --- */
  .active-filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 20px;
    min-height: 28px;
  }
  .filter-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    background: rgba(240,185,11,0.1);
    border: 1px solid rgba(240,185,11,0.3);
    border-radius: 16px;
    font-size: 0.78rem;
    color: var(--accent);
    font-weight: 600;
  }
  .filter-chip .remove {
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    opacity: 0.7;
    transition: opacity 0.15s;
  }
  .filter-chip .remove:hover { opacity: 1; }
  .result-count {
    margin-left: auto;
    font-size: 0.8rem;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .result-count strong { color: var(--accent); }

  /* --- Tabs --- */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
    background: var(--bg-secondary);
    border-radius: var(--radius);
    padding: 4px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .tab {
    padding: 10px 20px;
    border-radius: 6px;
    color: var(--text-secondary);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    background: transparent;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .tab:hover { color: var(--text-primary); background: rgba(255,255,255,0.04); }
  .tab.active {
    background: var(--accent);
    color: #000;
  }
  .tab .emoji { margin-right: 6px; }

  /* --- Grid --- */
  .gun-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }

  /* --- Card --- */
  .gun-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
  }
  .gun-card:hover {
    background: var(--bg-card-hover);
    border-color: #30363d;
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }
  .gun-card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent-dim), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .gun-card:hover::after { opacity: 1; }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }
  .gun-name {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text-primary);
  }
  .gun-name small {
    display: block;
    font-size: 0.75rem;
    font-weight: 400;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .gun-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .tag {
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .tag-ar   { background: rgba(240,185,11,0.15); color: var(--accent); }
  .tag-smg  { background: rgba(88,166,255,0.15); color: var(--info); }
  .tag-dmr  { background: rgba(188,140,255,0.15); color: var(--purple); }
  .tag-sniper { background: rgba(255,107,107,0.15); color: var(--danger); }
  .tag-lmg  { background: rgba(63,185,80,0.15); color: var(--success); }
  .tag-br   { background: rgba(255,140,66,0.15); color: #ff8c42; }
  .tag-shotgun { background: rgba(255,180,100,0.15); color: #ffb464; }

  .card-info {
    display: flex;
    gap: 16px;
    margin-bottom: 14px;
    font-size: 0.8rem;
    color: var(--text-secondary);
  }
  .card-info span { display: flex; align-items: center; gap: 4px; }

  .code-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 12px;
    margin-bottom: 8px;
  }
  .code-text {
    flex: 1;
    font-family: "SF Mono", "Fira Code", "Consolas", "Monaco", monospace;
    font-size: 0.8rem;
    color: var(--info);
    word-break: break-all;
    user-select: all;
    letter-spacing: 0.5px;
  }
  .copy-btn {
    padding: 6px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-secondary);
    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    font-weight: 600;
  }
  .copy-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .copy-btn.copied {
    border-color: var(--success);
    color: var(--success);
    background: rgba(63,185,80,0.1);
  }

  .card-meta {
    font-size: 0.75rem;
    color: var(--text-muted);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .card-meta span { display: flex; align-items: center; gap: 4px; }

  /* --- Expired Card --- */
  .gun-card.expired {
    opacity: 0.45;
    filter: grayscale(0.5);
    border-color: rgba(255,107,107,0.25);
  }
  .gun-card.expired:hover { opacity: 0.7; }
  .gun-card .expired-badge {
    display: none;
    position: absolute;
    top: 10px;
    right: 10px;
    padding: 3px 10px;
    background: rgba(255,107,107,0.2);
    border: 1px solid rgba(255,107,107,0.5);
    border-radius: 12px;
    color: var(--danger);
    font-size: 0.7rem;
    font-weight: 700;
    pointer-events: none;
    z-index: 1;
  }
  .gun-card.expired .expired-badge { display: block; }
  .gun-card .report-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 4px;
    color: var(--text-muted);
    font-size: 0.7rem;
    cursor: pointer;
    transition: all 0.15s;
    margin-left: 4px;
  }
  .gun-card .report-btn:hover {
    border-color: var(--danger);
    color: var(--danger);
    background: rgba(255,107,107,0.08);
  }
  .gun-card.expired .report-btn {
    color: var(--success);
  }
  .gun-card.expired .report-btn:hover {
    border-color: var(--success);
    color: var(--success);
    background: rgba(63,185,80,0.08);
  }

  .btn-toggle-expired {
    padding: 10px 16px;
    border-radius: var(--radius);
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-primary);
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn-toggle-expired:hover { border-color: var(--danger); color: var(--danger); }
  .btn-toggle-expired.active {
    border-color: var(--danger);
    color: var(--danger);
    background: rgba(255,107,107,0.08);
  }
  .btn-add {
    background: var(--success);
    color: #000;
    font-weight: 700;
  }
  .btn-add:hover { background: #4cc961; }

  /* --- Modal --- */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 999;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
    overflow-y: auto;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px;
    width: 100%;
    max-width: 520px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.6);
  }
  .modal h3 { font-size: 1.15rem; margin-bottom: 20px; color: var(--text-primary); }
  .modal label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 4px;
    margin-top: 12px;
  }
  .modal input, .modal select, .modal textarea {
    width: 100%;
    padding: 9px 12px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-primary);
    font-size: 0.9rem;
    outline: none;
    font-family: inherit;
  }
  .modal input:focus, .modal select:focus, .modal textarea:focus { border-color: var(--accent); }
  .modal textarea { resize: vertical; min-height: 48px; }
  .modal .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    justify-content: flex-end;
  }
  .modal .btn-cancel {
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
  }
  .modal .btn-cancel:hover { border-color: var(--text-secondary); color: var(--text-primary); }
  .modal .btn-save {
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
    background: var(--accent);
    color: #000;
    border: none;
  }
  .modal .btn-save:hover { background: #f5c71a; }

  .user-badge {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 10px;
    font-size: 0.65rem;
    font-weight: 700;
    background: rgba(63,185,80,0.15);
    color: var(--success);
    margin-left: 6px;
    vertical-align: middle;
  }
  .card-meta .edit-btn, .card-meta .del-btn {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 4px;
    color: var(--text-muted);
    font-size: 0.7rem;
    cursor: pointer;
    padding: 2px 6px;
    transition: all 0.15s;
  }
  .card-meta .edit-btn:hover { border-color: var(--accent); color: var(--accent); }
  .card-meta .del-btn:hover { border-color: var(--danger); color: var(--danger); }

  /* --- Empty State --- */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; display: block; }
  .empty-state p { font-size: 0.95rem; }

  /* --- Toast --- */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(0);
    background: var(--bg-card);
    border: 1px solid var(--success);
    color: var(--success);
    padding: 12px 24px;
    border-radius: var(--radius);
    font-size: 0.9rem;
    font-weight: 600;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    box-shadow: var(--shadow);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-8px); }

  /* --- Footer --- */
  .footer {
    text-align: center;
    padding: 32px 20px;
    color: var(--text-muted);
    font-size: 0.8rem;
    border-top: 1px solid var(--border);
    margin-top: 40px;
  }
  .footer a { color: var(--text-secondary); text-decoration: none; }
  .footer a:hover { color: var(--accent); }

  /* --- Pagination --- */
  .pagination-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 24px;
    padding: 16px 0;
    border-top: 1px solid var(--border);
  }
  .page-size-select {
    padding: 8px 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-primary);
    font-size: 0.82rem;
    outline: none;
    cursor: pointer;
  }
  .page-size-select:focus { border-color: var(--accent); }
  .page-size-select option { background: var(--bg-card); color: var(--text-primary); }
  .page-info {
    font-size: 0.82rem;
    color: var(--text-muted);
  }
  .page-btns {
    display: flex;
    gap: 4px;
    align-items: center;
  }
  .page-btn {
    padding: 7px 13px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-card);
    color: var(--text-secondary);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    min-width: 36px;
    text-align: center;
  }
  .page-btn:hover:not(:disabled):not(.active) {
    border-color: var(--accent);
    color: var(--accent);
  }
  .page-btn.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }
  .page-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .page-ellipsis {
    padding: 7px 6px;
    color: var(--text-muted);
    font-size: 0.82rem;
  }

  /* --- Responsive --- */
  @media (max-width: 768px) {
    .header h1 { font-size: 1.5rem; }
    .gun-grid { grid-template-columns: 1fr; }
    .controls { flex-direction: column; }
    .stats-bar { gap: 16px; }
    .tab { padding: 8px 14px; font-size: 0.8rem; }
    .pagination-bar { flex-direction: column; align-items: stretch; }
    .page-btns { justify-content: center; flex-wrap: wrap; }
  }

  /* --- Scrollbar --- */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg-primary); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #30363d; }
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <span class="header-icon">🎯</span>
  <h1>三角洲行动 · 改枪码大全</h1>
  <p class="subtitle">收录最新改枪方案，一键复制，直接导入游戏使用</p>
  <span class="season-badge">⚡ S10 核子裂变 · 2026年7月</span>
</header>

<!-- Stats Bar -->
<div class="stats-bar">
  <div class="stat-item"><div class="stat-value" id="totalGuns">0</div><div class="stat-label">收录方案</div></div>
  <div class="stat-item"><div class="stat-value" id="totalCategories">10</div><div class="stat-label">枪械类型</div></div>
  <div class="stat-item"><div class="stat-value">2026.07</div><div class="stat-label">数据更新</div></div>
</div>

<!-- Container -->
<div class="container">

  <!-- Tabs -->
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="all"><span class="emoji">📋</span>全部</button>
    <button class="tab" data-tab="fenghuo"><span class="emoji">🔥</span>烽火地带</button>
    <button class="tab" data-tab="streamer"><span class="emoji">⭐</span>主播同款</button>
  </div>

  <!-- Controls Row 1: Search + Filters -->
  <div class="controls">
    <div class="search-wrapper">
      <input type="text" id="searchInput" placeholder="搜索枪械名称、代号... （如 M7、AS Val、K416）" autocomplete="off">
      <span class="search-icon">🔍</span>
    </div>
    <select class="filter-select" id="categoryFilter">
      <option value="all">全部类型</option>
      <option value="突击步枪">🔫 突击步枪</option>
      <option value="冲锋枪">💨 冲锋枪</option>
      <option value="战斗步枪">⚡ 战斗步枪</option>
      <option value="射手步枪">🎯 射手步枪</option>
      <option value="狙击步枪">🔭 狙击步枪</option>
      <option value="轻机枪">💥 轻机枪</option>
      <option value="紧凑步枪">🗡️ 紧凑步枪</option>
      <option value="霰弹枪">🔧 霰弹枪</option>
      <option value="手枪">🔫 手枪</option>
      <option value="弓">🏹 弓</option>
    </select>
    <select class="filter-select" id="priceFilter">
      <option value="all">全部价位</option>
      <option value="budget">💰 经济型 (&lt;20万)</option>
      <option value="mid">💰 中配 (20万~50万)</option>

// ─── Parse price to numeric value for sorting ───
// "12万" → 120000, "~55万" → 550000, "满改"/"满配" → 999999, "中配" → 500000
function parsePrice(cost) {
  const cleaned = cost.replace(/[~≈]/g, '').trim();
  if (cleaned === '满改' || cleaned === '满配') return 999999;
  if (cleaned === '中配') return 500000;
  const match = cleaned.match(/^(\d+)万$/);
  if (match) return parseInt(match[1]) * 10000;
  return 0;
}

// ─── Get price tier label ───
function getPriceTier(cost) {
  const price = parsePrice(cost);
  if (price >= 900000) return '满改/顶配';
  if (price >= 500000) return '高配';
  if (price >= 200000) return '中配';
  return '经济型';
}

let userGuns = [];

  const saved = localStorage.getItem('delta_gun_userdata');
  if (saved) { userGuns = JSON.parse(saved); }
} catch(e) {}

function saveUserGuns() {
  try { localStorage.setItem('delta_gun_userdata', JSON.stringify(userGuns)); } catch(e) {}
}

// Merge built-in + user codes, attach price
function allGuns() {
  return [...guns, ...userGuns];
}

// Attach numeric price to built-in once
guns.forEach(g => { g._price = parsePrice(g.cost); });

// ─── Modal logic ───
let editingCode = null; // non-null = editing a user code

function openAddModal() {
  editingCode = null;
  document.getElementById('modalTitle').textContent = '➕ 添加改枪方案';
  document.getElementById('modalName').value = '';
  document.getElementById('modalSub').value = '';
  document.getElementById('modalCode').value = '';
  document.getElementById('modalCategory').value = '突击步枪';
  document.getElementById('modalTab').value = 'fenghuo';
  document.getElementById('modalCost').value = '';
  document.getElementById('modalDesc').value = '';
  document.getElementById('modalSave').textContent = '💾 保存';
  document.getElementById('modalOverlay').classList.add('show');
  document.getElementById('modalName').focus();
}

function openEditModal(code) {
  const gun = userGuns.find(g => g.code === code);
  if (!gun) return;
  editingCode = code;
  document.getElementById('modalTitle').textContent = '✏️ 编辑改枪方案';
  document.getElementById('modalName').value = gun.name;
  document.getElementById('modalSub').value = gun.sub;
  document.getElementById('modalCode').value = gun.code;
  document.getElementById('modalCategory').value = gun.category;
  document.getElementById('modalTab').value = gun.tab;
  document.getElementById('modalCost').value = gun.cost;
  document.getElementById('modalDesc').value = gun.desc;
  document.getElementById('modalSave').textContent = '💾 更新';
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  editingCode = null;
}

function saveModal() {
  const name = document.getElementById('modalName').value.trim();
  const sub = document.getElementById('modalSub').value.trim();
  const code = document.getElementById('modalCode').value.trim();
  const category = document.getElementById('modalCategory').value;
  const tab = document.getElementById('modalTab').value;
  const cost = document.getElementById('modalCost').value.trim() || '满改';
  const desc = document.getElementById('modalDesc').value.trim() || '自定义方案';

  if (!name || !sub || !code) {
    showToast('⚠ 枪械名称、方案名称和改枪码不能为空');
    return;
  }

  if (editingCode) {
    // Edit existing
    const idx = userGuns.findIndex(g => g.code === editingCode);
    if (idx >= 0) {
      userGuns[idx] = { name, sub, code, category, tab, cost, desc, _price: parsePrice(cost) };
    }
  } else {
    // Check duplicate code
    if (userGuns.some(g => g.code === code) || guns.some(g => g.code === code)) {
      showToast('⚠ 该改枪码已存在，请检查');
      return;
    }
    userGuns.push({ name, sub, code, category, tab, cost, desc, _price: parsePrice(cost) });
  }

  saveUserGuns();
  closeModal();
  showToast(editingCode ? '✅ 方案已更新！' : '✅ 新方案已添加！');
  render();
}

function deleteUserGun(code) {
  if (!confirm('确定删除这个方案吗？此操作不可恢复。')) return;
  userGuns = userGuns.filter(g => g.code !== code);
  if (expiredCodes.has(code)) expiredCodes.delete(code);
  saveUserGuns();
  saveExpired();
  render();
  showToast('🗑 方案已删除');
}

// ─── Init: attach price to user guns ───
userGuns.forEach(g => { g._price = parsePrice(g.cost); });

// ─── Expired codes (persisted in localStorage) ───
let expiredCodes = new Set();
try {
  const saved = localStorage.getItem('delta_gun_expired');
  if (saved) { expiredCodes = new Set(JSON.parse(saved)); }
} catch(e) {}

function saveExpired() {
  try { localStorage.setItem('delta_gun_expired', JSON.stringify([...expiredCodes])); } catch(e) {}
}

function toggleExpired(code) {
  if (expiredCodes.has(code)) {
    expiredCodes.delete(code);
  } else {
    expiredCodes.add(code);
  }
  saveExpired();
  render();
}

// ─── State ───
let activeTab = 'all';
let searchQuery = '';
let categoryFilter = 'all';
let priceFilter = 'all';
let sortBy = 'default';
let currentPage = 1;
let pageSize = 12;
let hideExpired = false;

// ─── Render ───
function render() {
  // Step 1: merge built-in + user codes
  const merged = allGuns();

  // Step 2: filter
  let filtered = merged.filter(g => {
    if (activeTab !== 'all' && g.tab !== activeTab) return false;
    if (categoryFilter !== 'all' && g.category !== categoryFilter) return false;
    if (priceFilter !== 'all') {
      const p = g._price;
      if (priceFilter === 'budget' && p >= 200000) return false;
      if (priceFilter === 'mid' && (p < 200000 || p >= 500000)) return false;
      if (priceFilter === 'high' && (p < 500000 || p >= 900000)) return false;
      if (priceFilter === 'maxed' && p < 900000) return false;
    }
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      if (!g.name.toLowerCase().includes(q) && !g.sub.toLowerCase().includes(q) && !g.desc.toLowerCase().includes(q) && !g.code.toLowerCase().includes(q)) {
        return false;
      }
    }
    if (hideExpired && expiredCodes.has(g.code)) return false;
    return true;
  });

  // Step 3: sort
  if (sortBy === 'price-asc') {
    filtered.sort((a, b) => a._price - b._price || a.name.localeCompare(b.name));
  } else if (sortBy === 'price-desc') {
    filtered.sort((a, b) => b._price - a._price || a.name.localeCompare(b.name));
  } else if (sortBy === 'name-asc') {
    filtered.sort((a, b) => a.name.localeCompare(b.name) || a._price - b._price);
  } else if (sortBy === 'name-desc') {
    filtered.sort((a, b) => b.name.localeCompare(a.name) || a._price - b._price);
  }

  // Step 4: paginate
  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * pageSize;
  const paged = filtered.slice(start, start + pageSize);

  // Step 5: render grid
  const grid = document.getElementById('gunGrid');
  const empty = document.getElementById('emptyState');

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    grid.innerHTML = paged.map((g, i) => {
      const tagClass = getTagClass(g.category);
      const isExpired = expiredCodes.has(g.code);
      const isUser = userGuns.some(ug => ug.code === g.code);
      return `
        <div class="gun-card ${isExpired ? 'expired' : ''}" style="animation: fadeIn 0.3s ${Math.min(i * 0.02, 0.8)}s both;">
          <span class="expired-badge">⚠ 已过期</span>
          <div class="card-header">
            <div class="gun-name">
              ${g.name}${isUser ? '<span class="user-badge">我的</span>' : ''}
              <small>${g.sub}</small>
            </div>
            <div class="gun-tags">
              <span class="tag ${tagClass}">${g.category}</span>
            </div>
          </div>
          <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:12px;">${g.desc}</p>
          <div class="code-box">
            <code class="code-text">${g.code}</code>
            <button class="copy-btn" onclick="copyCode('${g.code.replace(/'/g, "\\'")}', this)" title="点击复制改枪码">📋 复制</button>
          </div>
          <div class="card-meta">
            <span>💰 ${g.cost}</span>
            <span>🏷️ ${getTabLabel(g.tab)}</span>
            <button class="report-btn" onclick="toggleExpired('${g.code.replace(/'/g, "\\'")}'); event.stopPropagation();" title="${isExpired ? '标记为未过期' : '标记为已过期'}">${isExpired ? '🔄 恢复' : '⚠ 过期'}</button>
            ${isUser ? `<button class="edit-btn" onclick="openEditModal('${g.code.replace(/'/g, "\\'")}'); event.stopPropagation();" title="编辑">✏️</button><button class="del-btn" onclick="deleteUserGun('${g.code.replace(/'/g, "\\'")}'); event.stopPropagation();" title="删除">🗑</button>` : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  // Step 6: update filters UI first (creates resultCount element), then set counts
  updateActiveFilters();
  document.getElementById('resultCount').textContent = filtered.length;
  document.getElementById('totalGuns').textContent = merged.length;
  document.getElementById('totalCategories').textContent = countCategories();
  document.getElementById('pageInfo').textContent = `第 ${currentPage} 页，共 ${totalPages} 页`;
  renderPageButtons(totalPages);

  // Show/hide pagination bar
  document.getElementById('paginationBar').style.display = filtered.length === 0 ? 'none' : 'flex';
}

// ─── Pagination buttons ───
function renderPageButtons(totalPages) {
  const container = document.getElementById('pageBtns');
  let html = '';

  html += `<button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>◀ 上一页</button>`;

  const pages = [];
  if (totalPages <= 7) {
    for (let i = 1; i <= totalPages; i++) pages.push(i);
  } else {
    pages.push(1);
    if (currentPage > 3) pages.push('...');
    for (let i = Math.max(2, currentPage - 1); i <= Math.min(totalPages - 1, currentPage + 1); i++) {
      pages.push(i);
    }
    if (currentPage < totalPages - 2) pages.push('...');
    pages.push(totalPages);
  }

  pages.forEach(p => {
    if (p === '...') {
      html += '<span class="page-ellipsis">…</span>';
    } else {
      html += `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="goPage(${p})">${p}</button>`;
    }
  });

  html += `<button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>下一页 ▶</button>`;

  container.innerHTML = html;
}

function goPage(page) {
  const merged = allGuns();
  const totalPages = Math.max(1, Math.ceil(
    merged.filter(g => {
      if (activeTab !== 'all' && g.tab !== activeTab) return false;
      if (categoryFilter !== 'all' && g.category !== categoryFilter) return false;
      if (priceFilter !== 'all') {
        const p = g._price;
        if (priceFilter === 'budget' && p >= 200000) return false;
        if (priceFilter === 'mid' && (p < 200000 || p >= 500000)) return false;
        if (priceFilter === 'high' && (p < 500000 || p >= 900000)) return false;
        if (priceFilter === 'maxed' && p < 900000) return false;
      }
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        if (!g.name.toLowerCase().includes(q) && !g.sub.toLowerCase().includes(q) && !g.desc.toLowerCase().includes(q) && !g.code.toLowerCase().includes(q)) return false;
      }
      return true;
    }).length
  ) / pageSize);

  if (page < 1 || page > totalPages) return;
  currentPage = page;
  render();
  document.getElementById('gunGrid').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ─── Active filter chips ───
function updateActiveFilters() {
  const container = document.getElementById('activeFilters');
  let chips = '';

  if (activeTab !== 'all') {
    chips += `<span class="filter-chip">${getTabLabel(activeTab)} <span class="remove" data-clear="tab">×</span></span>`;
  }
  if (categoryFilter !== 'all') {
    chips += `<span class="filter-chip">${categoryFilter} <span class="remove" data-clear="category">×</span></span>`;
  }
  if (priceFilter !== 'all') {
    const labels = { budget: '经济型 <20万', mid: '中配 20~50万', high: '高配 50~80万', maxed: '满改/顶配' };
    chips += `<span class="filter-chip">${labels[priceFilter] || priceFilter} <span class="remove" data-clear="price">×</span></span>`;
  }
  if (searchQuery) {
    chips += `<span class="filter-chip">🔍 "${searchQuery}" <span class="remove" data-clear="search">×</span></span>`;
  }

  container.innerHTML = chips + `<span class="result-count" id="resultCountWrapper">共 <strong id="resultCount">0</strong> 个方案</span>`;

  // Click-to-remove listeners
  container.querySelectorAll('.remove').forEach(el => {
    el.addEventListener('click', () => {
      const clear = el.dataset.clear;
      if (clear === 'tab') { setActiveTab('all'); }
      else if (clear === 'category') {
        document.getElementById('categoryFilter').value = 'all';
        categoryFilter = 'all';
      }
      else if (clear === 'price') {
        document.getElementById('priceFilter').value = 'all';
        priceFilter = 'all';
      }
      else if (clear === 'search') {
        document.getElementById('searchInput').value = '';
        searchQuery = '';
      }
      currentPage = 1;
      render();
    });
  });

  // Re-update result count after chips HTML is set
  const countEl = document.getElementById('resultCount');
  if (countEl) {
    // count is set in render() before updateActiveFilters, so we re-read from grid
  }
}

function setActiveTab(tabName) {
  activeTab = tabName;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const target = document.querySelector(`.tab[data-tab="${tabName}"]`);
  if (target) target.classList.add('active');
}

// ─── Helpers ───
function getTagClass(cat) {
  const map = {
    '突击步枪': 'tag-ar',
    '冲锋枪': 'tag-smg',
    '射手步枪': 'tag-dmr',
    '狙击步枪': 'tag-sniper',
    '轻机枪': 'tag-lmg',
    '战斗步枪': 'tag-br',
    '紧凑步枪': 'tag-smg',
    '霰弹枪': 'tag-shotgun',
    '手枪': 'tag-ar',
    '弓': 'tag-dmr',
  };
  return map[cat] || 'tag-ar';
}

function getTabLabel(tab) {
  const map = {
    'fenghuo': '🔥 烽火地带',
    'battlefield': '⚔️ 全面战场',
    'streamer': '⭐ 主播同款',
    'gold': '🎖️ 金枪客',
    'budget': '💰 KC17',
    'all': '综合',
  };
  return map[tab] || tab;
}

// ─── Get unique category count ───
function countCategories() {
  const cats = new Set(allGuns().map(g => g.category));
  return cats.size;
}

// ─── Copy ───
function copyCode(code, btn) {
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = '✅ 已复制';
    btn.classList.add('copied');
    showToast('✅ 改枪码已复制到剪贴板！可直接在游戏中导入');
    setTimeout(() => {
      btn.textContent = '📋 复制';
      btn.classList.remove('copied');
    }, 2000);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = code;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '✅ 已复制';
    btn.classList.add('copied');
    showToast('✅ 改枪码已复制到剪贴板！');
    setTimeout(() => {
      btn.textContent = '📋 复制';
      btn.classList.remove('copied');
    }, 2000);
  });
}

// ─── Toast ───
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove('show'), 2500);
}

// ─── Event Listeners ───
document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  setActiveTab(tab.dataset.tab);
  currentPage = 1;
  render();
});

document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  currentPage = 1;
  render();
});

document.getElementById('categoryFilter').addEventListener('change', e => {
  categoryFilter = e.target.value;
  currentPage = 1;
  render();
});

document.getElementById('priceFilter').addEventListener('change', e => {
  priceFilter = e.target.value;
  currentPage = 1;
  render();
});

document.getElementById('sortBy').addEventListener('change', e => {
  sortBy = e.target.value;
  currentPage = 1;
  render();
});

document.getElementById('pageSizeSelect').addEventListener('change', e => {
  pageSize = parseInt(e.target.value);
  currentPage = 1;
  render();
});

document.getElementById('toggleExpiredBtn').addEventListener('click', function() {
  hideExpired = !hideExpired;
  this.classList.toggle('active', hideExpired);
  this.innerHTML = hideExpired ? '⏳ 显示全部' : '⏳ 隐藏过期';
  currentPage = 1;
  render();
});

document.getElementById('addBtn').addEventListener('click', openAddModal);
document.getElementById('modalCancel').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.getElementById('modalSave').addEventListener('click', saveModal);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

document.getElementById('resetBtn').addEventListener('click', () => {
  setActiveTab('all');
  searchQuery = '';
  categoryFilter = 'all';
  priceFilter = 'all';
  sortBy = 'default';
  currentPage = 1;
  pageSize = 12;
  hideExpired = false;
  document.getElementById('searchInput').value = '';
  document.getElementById('categoryFilter').value = 'all';
  document.getElementById('priceFilter').value = 'all';
  document.getElementById('sortBy').value = 'default';
  document.getElementById('pageSizeSelect').value = '12';
  const btn = document.getElementById('toggleExpiredBtn');
  btn.classList.remove('active');
  btn.innerHTML = '⏳ 隐藏过期';
  render();
});

// ─── Keyboard shortcuts ───
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'r') {
    e.preventDefault();
    document.getElementById('resetBtn').click();
  }
});

// ─── Init ───
document.getElementById('totalCategories').textContent = countCategories();
render();

// ─── Animation ───
const styleEl = document.createElement('style');
styleEl.textContent = `
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
`;
document.head.appendChild(styleEl);
</script>
